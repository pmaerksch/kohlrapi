name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.4'
            lowest: true
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-stable ${{ matrix.lowest && '--prefer-lowest' || '' }}

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
